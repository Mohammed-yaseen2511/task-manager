<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Task Manager{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem; }
    .card { max-width: 520px; margin: 3rem auto 0; background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    input[type=text], input[type=password], input[type=date], select { padding: .6rem; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
    button { padding: .6rem 1rem; border: 0; background: #2563eb; color: #fff; border-radius: 8px; cursor: pointer; font-size: 1rem; }

    .add-form { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .add-form input[type=text] { flex: 1; min-width: 160px; }
    .auth-form { display: flex; flex-direction: column; gap: .7rem; }

    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid #eee; }
    .done { text-decoration: line-through; color: #999; }
    .actions form { display: inline; margin: 0; }
    .link-btn { background: none; color: #2563eb; padding: 0; margin-left: .8rem; }
    .link-btn.danger { color: #dc2626; }
    .link-btn:hover { text-decoration: underline; }
    a.link-btn { text-decoration: none; }

    /* Priority and due date */
    .meta { display: flex; gap: .5rem; align-items: center; margin-top: .25rem; font-size: .8rem; color: #6b7280; }
    .badge { padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .p-3 { background: #fee2e2; color: #b91c1c; }
    .p-2 { background: #fef3c7; color: #b45309; }
    .p-1 { background: #e0f2fe; color: #0369a1; }
    .overdue { color: #dc2626; font-weight: 600; }

    .flash { background: #fff4d6; border-radius: 8px; padding: .6rem .8rem; margin: 0 0 1rem; }
    .small { color: #666; font-size: .9rem; margin-top: 1rem; }

    /* Top right buttons */
    .topbar { position: fixed; top: 1rem; right: 1.5rem; display: flex; gap: .5rem; }
    .topbar form { margin: 0; }
    .nav-btn { display: inline-block; padding: .5rem 1rem; background: #2563eb; color: #fff; border-radius: 8px; font-size: .9rem; text-decoration: none; }
  </style>
</head>
<body>
  <nav class="topbar">
    <a class="nav-btn" href="{{ url_for('index') }}">Home</a>
    {% if current_user.is_authenticated %}
    <a class="nav-btn" href="{{ url_for('change_password') }}">Change password</a>
    <form action="{{ url_for('logout') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="nav-btn" type="submit">Logout ({{ current_user.username }})</button>
    </form>
    {% endif %}
  </nav>

  <div class="card">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <p class="flash">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
