{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<h1>Create account</h1>
<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="text" name="username" placeholder="Username (3-50 characters)" autocomplete="username" minlength="3" maxlength="50" required autofocus>
  <input type="password" name="password" placeholder="Password (min 8 characters)" autocomplete="new-password" minlength="8" required>
  <input type="password" name="confirm" placeholder="Confirm password" autocomplete="new-password" minlength="8" required>
  <button type="submit">Register</button>
</form>
<p class="small">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
