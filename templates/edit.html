{% extends "base.html" %}
{% block title %}Edit task{% endblock %}

{% block content %}
<h1>Edit task</h1>
<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="text" name="title" value="{{ task.title }}" maxlength="255" required autofocus>
  <select name="priority">
    {% for value, label in priorities.items() %}
    <option value="{{ value }}" {{ 'selected' if value == task.priority else '' }}>{{ label }}</option>
    {% endfor %}
  </select>
  <input type="date" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">
  <button type="submit">Save changes</button>
</form>
<p class="small"><a href="{{ url_for('index') }}">Cancel</a></p>
{% endblock %}
