<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem; }
    .card { max-width: 520px; margin: auto; background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input[type=text] { flex: 1; padding: .6rem; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: .6rem 1rem; border: 0; background: #2563eb; color: #fff; border-radius: 8px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: .6rem 0; border-bottom: 1px solid #eee; }
    .done { text-decoration: line-through; color: #999; }
    a { text-decoration: none; margin-left: .6rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Task Manager</h1>
    <form action="{{ url_for('add') }}" method="post">
      <input type="text" name="title" placeholder="What needs doing?" required>
      <button type="submit">Add</button>
    </form>
    <ul>
      {% for t in tasks %}
      <li>
        <span class="{{ 'done' if t.done else '' }}">{{ t.title }}</span>
        <span>
          <a href="{{ url_for('toggle', task_id=t.id) }}">{{ 'Undo' if t.done else 'Done' }}</a>
          <a href="{{ url_for('delete', task_id=t.id) }}">Delete</a>
        </span>
      </li>
      {% else %}
      <li>No tasks yet. Add one above!</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
