{% extends "base.html" %}
{% block title %}Change password{% endblock %}

{% block content %}
<h1>Change password</h1>
<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="password" name="current_password" placeholder="Current password" autocomplete="current-password" required autofocus>
  <input type="password" name="new_password" placeholder="New password (min 8 characters)" autocomplete="new-password" minlength="8" required>
  <input type="password" name="confirm" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
  <button type="submit">Update password</button>
</form>
<p class="small"><a href="{{ url_for('index') }}">Back to tasks</a></p>
{% endblock %}
